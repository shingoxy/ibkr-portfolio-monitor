<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IBKR 持仓分析{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><strong>IBKR</strong> 持仓分析</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/">仪表盘</a></li>
                    <li class="nav-item"><a class="nav-link" href="/positions">持仓</a></li>
                    <li class="nav-item"><a class="nav-link" href="/strategies">期权策略</a></li>
                    <li class="nav-item"><a class="nav-link" href="/orders">挂单</a></li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">导出</a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/api/export/markdown" target="_blank">Markdown</a></li>
                            <li><a class="dropdown-item" href="/api/export/json" target="_blank">JSON</a></li>
                        </ul>
                    </li>
                    <li class="nav-item"><span class="nav-link text-success" id="nav-mode">只读模式</span></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container-fluid mt-3">
        <div id="connection-bar" class="alert alert-secondary py-1 mb-2">
            <small>
                <span id="conn-status" class="badge bg-secondary">未连接</span>
                <span id="conn-mode" class="badge bg-info ms-1">Unknown</span>
                <span id="conn-accounts" class="ms-2"></span>
                <span id="conn-update" class="ms-2 text-muted"></span>
                <span id="conn-freshness" class="ms-2"></span>
                <button id="btn-refresh" class="btn btn-sm btn-outline-primary ms-3" onclick="triggerRefresh()">手动刷新</button>
            </small>
        </div>
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
