{% extends "base.html" %}
{% block title %}持仓 - IBKR{% endblock %}
{% block content %}
<div class="row mb-3">
    <div class="col-12 d-flex justify-content-between align-items-center">
        <h4>持仓明细</h4>
        <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary active" onclick="filterType('')" id="btn-all">全部</button>
            <button class="btn btn-outline-secondary" onclick="filterType('STK')" id="btn-stk">股票</button>
            <button class="btn btn-outline-secondary" onclick="filterType('OPT')" id="btn-opt">期权</button>
        </div>
    </div>
</div>
<div class="row mb-3">
    <div class="col-md-4">
        <input type="text" class="form-control form-control-sm" id="filter-symbol" placeholder="搜索标的代码..." oninput="applyFilters()">
    </div>
    <div class="col-md-3">
        <select class="form-select form-select-sm" id="sort-by" onchange="applyFilters()">
            <option value="symbol">按标的</option>
            <option value="unrealized_pnl">按未实现盈亏</option>
            <option value="daily_pnl">按当日盈亏</option>
            <option value="market_value">按市值</option>
            <option value="position">按数量</option>
            <option value="strike">按行权价</option>
            <option value="expiry">按到期日</option>
            <option value="delta">按 Delta</option>
        </select>
    </div>
    <div class="col-md-2">
        <select class="form-select form-select-sm" id="sort-dir" onchange="applyFilters()">
            <option value="asc">升序</option>
            <option value="desc">降序</option>
        </select>
    </div>
</div>

<div class="row mb-4"><div class="col-12"><div class="card">
    <div class="card-header">股票/ETF 持仓</div>
    <div class="card-body p-0"><div class="table-responsive">
        <table class="table table-hover table-sm mb-0">
            <thead><tr>
                <th>标的</th><th class="text-end">数量</th><th class="text-end">成本价</th>
                <th class="text-end">现价</th><th class="text-end">市值</th>
                <th class="text-end">未实现盈亏</th><th class="text-end">盈亏%</th>
            </tr></thead>
            <tbody id="tbody-stocks"></tbody>
        </table>
    </div></div>
</div></div></div>
<div class="row"><div class="col-12"><div class="card">
    <div class="card-header">期权持仓</div>
    <div class="card-body p-0"><div class="table-responsive">
        <table class="table table-hover table-sm mb-0">
            <thead><tr>
                <th>标的</th><th>类型</th><th class="text-end">行权价</th><th>到期日</th>
                <th class="text-end">数量</th><th class="text-end">成本</th><th class="text-end">现价</th>
                <th class="text-end">市值</th><th class="text-end">盈亏</th>
                <th class="text-end">Delta</th><th class="text-end">IV</th>
            </tr></thead>
            <tbody id="tbody-options"></tbody>
        </table>
    </div></div>
</div></div></div>
{% endblock %}
{% block scripts %}
<script>
let allPositions = [];
let currentTypeFilter = '';

function filterType(type) {
    currentTypeFilter = type;
    document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
    if (type === '') document.getElementById('btn-all').classList.add('active');
    else if (type === 'STK') document.getElementById('btn-stk').classList.add('active');
    else document.getElementById('btn-opt').classList.add('active');
    applyFilters();
}

function applyFilters() {
    let filtered = [...allPositions];
    const symbol = document.getElementById('filter-symbol').value.toUpperCase();
    const sortBy = document.getElementById('sort-by').value;
    const sortDir = document.getElementById('sort-dir').value;

    if (currentTypeFilter) filtered = filtered.filter(p => p.sec_type === currentTypeFilter);
    if (symbol) filtered = filtered.filter(p => p.symbol.toUpperCase().includes(symbol));

    const reverse = sortDir === 'desc';
    if (['unrealized_pnl', 'daily_pnl', 'market_value', 'position', 'avg_cost', 'market_price', 'strike', 'delta'].includes(sortBy)) {
        filtered.sort((a, b) => ((a[sortBy] || 0) - (b[sortBy] || 0)) * (reverse ? -1 : 1));
    } else if (sortBy === 'expiry') {
        filtered.sort((a, b) => ((a.expiry || '') > (b.expiry || '') ? 1 : -1) * (reverse ? -1 : 1));
    } else {
        filtered.sort((a, b) => ((a.symbol || '') > (b.symbol || '') ? 1 : -1) * (reverse ? -1 : 1));
    }

    renderPositions(filtered);
}

function renderPositions(positions) {
    const stocks = positions.filter(p => p.sec_type === 'STK');
    const options = positions.filter(p => p.sec_type === 'OPT');

    document.getElementById('tbody-stocks').innerHTML = stocks.length === 0
        ? '<tr><td colspan="7" class="text-center text-muted py-3">无股票持仓</td></tr>'
        : stocks.map(p => {
            const mp = p.market_price || 0;
            const ac = p.avg_cost || 0;
            const pos = p.position || 0;
            const pct = ac > 0 ? ((mp - ac) / ac * 100) : 0;
            return `<tr>
                <td><strong>${p.symbol}</strong></td>
                <td class="text-end">${pos.toFixed(0)}</td>
                <td class="text-end">${ac.toFixed(2)}</td>
                <td class="text-end">${mp > 0 ? mp.toFixed(2) : '--'}</td>
                <td class="text-end">${formatMoney(p.market_value)}</td>
                <td class="text-end ${(p.unrealized_pnl||0) >= 0 ? 'text-success' : 'text-danger'}">${formatPnl(p.unrealized_pnl)}</td>
                <td class="text-end ${pct >= 0 ? 'text-success' : 'text-danger'}">${pct.toFixed(1)}%</td>
            </tr>`;
        }).join('');

    document.getElementById('tbody-options').innerHTML = options.length === 0
        ? '<tr><td colspan="11" class="text-center text-muted py-3">无期权持仓</td></tr>'
        : options.map(p => {
            const right = p.right === 'C' ? 'Call' : 'Put';
            const expFmt = p.expiry ? p.expiry.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3') : '';
            const mp = p.market_price || 0;
            const ac = p.avg_cost || 0;
            const pos = p.position || 0;
            const stk = p.strike || 0;
            return `<tr>
                <td><strong>${p.symbol}</strong></td>
                <td>${right}</td>
                <td class="text-end">${stk.toFixed(1)}</td>
                <td>${expFmt}</td>
                <td class="text-end">${pos.toFixed(0)}</td>
                <td class="text-end">${ac.toFixed(2)}</td>
                <td class="text-end">${mp > 0 ? mp.toFixed(2) : '<span class="text-muted">延迟</span>'}</td>
                <td class="text-end">${formatMoney(p.market_value)}</td>
                <td class="text-end ${(p.unrealized_pnl||0) >= 0 ? 'text-success' : 'text-danger'}">${formatPnl(p.unrealized_pnl)}</td>
                <td class="text-end">${(p.delta || 0).toFixed(3)}</td>
                <td class="text-end">${(p.implied_vol || 0).toFixed(2)}</td>
            </tr>`;
        }).join('');
}

async function loadPositions() {
    allPositions = await fetchAPI('/api/positions') || [];
    applyFilters();
}
loadPositions();
setInterval(loadPositions, 5000);
</script>
{% endblock %}
